# modern dark theme: near-black surface, single emerald accent.
[theme]
base = "dark"
primaryColor = "#3ecf8e"          # emerald accent (buttons, focus, links)
backgroundColor = "#0a0a0b"
secondaryBackgroundColor = "#151517"  # widget chrome (selects, code, sidebar)
textColor = "#f2f2f3"

[server]
headless = true
